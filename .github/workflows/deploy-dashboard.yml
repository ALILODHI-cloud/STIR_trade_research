name: Deploy STIR dashboard

on:
  push:
    branches: [claude/hopeful-babbage-ahkapg, cursor/stir-curve-snapshot-70e4]
    paths:
      - "research/dashboard/**"
      - "data/cache/stir_curves/**"
      - "scripts/build_dashboard_data.py"
      - "scripts/refresh_fred_spots.py"
      - ".github/workflows/deploy-dashboard.yml"
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

# Dual publish:
# 1) gh-pages branch (enable Pages → Deploy from a branch → gh-pages /)
# 2) GitHub Actions Pages (enable Pages → Source: GitHub Actions)
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pandas curl_cffi

      - name: Refresh FRED policy spots
        run: python3 scripts/refresh_fred_spots.py
        continue-on-error: true

      - name: Build dashboard JSON
        run: python3 scripts/build_dashboard_data.py

      # Project Pages need this base href so assets resolve under /STIR_trade_research/
      - name: Inject Pages base href
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("research/dashboard/index.html")
          t = p.read_text()
          if '<base ' not in t:
              t = t.replace(
                  "<head>\n",
                  '<head>\n  <base href="/STIR_trade_research/" />\n',
                  1,
              )
              p.write_text(t)
          print("base href injected")
          PY

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: research/dashboard
          force_orphan: true
          full_commit_message: "Deploy STIR dashboard"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: research/dashboard
        continue-on-error: true

  deploy-actions-pages:
    needs: build-and-publish
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
